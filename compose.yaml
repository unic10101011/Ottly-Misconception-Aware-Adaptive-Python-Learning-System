name: ottly

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ai_coding_platform
      MYSQL_USER: ottly
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    image: ottly-backend:local
    build: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://ottly:${DB_PASSWORD:?Set DB_PASSWORD}@db:3306/ai_coding_platform
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      AI_ACCEPTANCE_LOG: ${AI_ACCEPTANCE_LOG:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data
      - web
    read_only: true
    tmpfs:
      - /tmp:size=64m
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m

  frontend:
    image: ottly-frontend:local
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:80"
    networks:
      - web

networks:
  data:
    internal: true
  web:

volumes:
  db_data:
    name: ${OTTLY_DB_VOLUME:-ottly_db_data}
    external: ${OTTLY_DB_EXTERNAL:-false}
